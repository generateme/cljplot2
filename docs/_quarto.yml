format:
  html:
    toc: true
    toc-location: right
    toc-depth: 4
    theme: cosmo
    include-in-header:
      text: |-
        <style>
        .data-table { width: fit-content; max-width: 100%; max-height: 15rem; overflow: auto; margin: 0 0 1rem 0; }
        .data-table .table-responsive { overflow: visible; }
        .data-table table { font-size: 0.75rem; width: auto; margin: 0; }
        .data-table th, .data-table td { padding: 0.1rem 0.45rem !important; white-space: nowrap; }
        .data-table thead th { position: sticky; top: 0; background: var(--bs-body-bg, #fff); }
        </style>
project: {type: book}
book:
  chapters:
  - index.qmd
  - part: 'Reference: concepts'
    chapters: [reference.intro.qmd, reference.render.qmd, reference.data_mapping.qmd, reference.aesthetics_legends.qmd, reference.scales_axes_coords.qmd, reference.layering_position.qmd, reference.labels_text.qmd, reference.facets_arrange.qmd, reference.theme.qmd, reference.shared_options.qmd, reference.errors.qmd, reference.limits.qmd]
  - part: 'Reference: charts'
    chapters: [reference.charts_points_paths.qmd, reference.charts_series.qmd, reference.charts_annotations.qmd, reference.charts_bars_ranges.qmd, reference.charts_strip_distributions.qmd, reference.charts_distribution_stats.qmd, reference.charts_grids_fields.qmd, reference.charts_part_of_whole.qmd, reference.charts_multivariate_3d.qmd]
  - part: 'Reference: builders'
    chapters: [reference.builders_graphs.qmd, reference.builders_trees.qmd, reference.builders_series.qmd]
  - part: 'Reference: data functions'
    chapters: [reference.data_levels.qmd, reference.data_graphs_trees.qmd, reference.data_sets_series.qmd, reference.data_fields.qmd, reference.specific_cases.qmd]
  - part: Use cases
    chapters: [use_cases.distribution.qmd, use_cases.colors.qmd, use_cases.evolution.qmd, use_cases.ranking.qmd, use_cases.part_of_a_whole.qmd, use_cases.correlation.qmd, use_cases.flow.qmd]
  - part: Galleries
    chapters: [galleries.cljplot_extras.qmd, galleries.lattice.qmd, galleries.vega.qmd]
  title: cljplot2
